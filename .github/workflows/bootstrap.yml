name: Bootstrap Laputa baseline

on:
  push:
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Materialize verified baseline
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-* > /tmp/laputa-bootstrap.tar.gz.b64
          base64 -d /tmp/laputa-bootstrap.tar.gz.b64 > /tmp/laputa-bootstrap.tar.gz
          echo '99f1ced4a27751d048ce21c9270ec5408195c214b2c9a0341198e216f11267cd  /tmp/laputa-bootstrap.tar.gz' | sha256sum -c -
          tar -xzf /tmp/laputa-bootstrap.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit initialized project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Laputa Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(workspace): initialize laputa product baseline (#LAPUTA-001) [model:GPT-5.6 Sol]'
          git push origin HEAD:main
