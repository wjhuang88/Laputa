name: E5 autofmt

on:
  push:
    branches:
      - feature/laputa-001-e5-runway-adapter
    paths:
      - .github/workflows/e5-autofmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0

      - name: Format Runway adapter and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/laputa-provider-runway/src/lib.rs")
          text = path.read_text()
          text = text.replace("    path::Path,\n", "")
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/laputa-provider-runway/src/lib.rs crates/laputa-provider-runway/tests/live_smoke.rs
          if git diff --cached --quiet; then
            echo "Runway adapter already formatted"
            exit 0
          fi
          git commit -m "style(provider): format Runway adapter"
          git push origin "HEAD:${GITHUB_REF_NAME}"
