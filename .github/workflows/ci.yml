name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0

      # Temporary branch bootstrap: materialize Cargo.lock after workspace dependency changes.
      # Remove this step and restore read-only permissions before merge.
      - name: Materialize understanding lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "Laputa CI"
            git config user.email "actions@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build(agent): refresh understanding lockfile (#LAPUTA-001-B) [model:GPT-5.6 Sol]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install desktop native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libvulkan-dev

      - name: Validate workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          cargo test -p laputa-app --features desktop-ui --bin laputa-desktop --locked
          scripts/validate_project_governance.sh .
