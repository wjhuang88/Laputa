name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0

      - name: Materialize product rustfmt
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/laputa-001-d-product-workspace'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- crates/laputa-app/src/bin/laputa-desktop-product.rs; then
            echo 'Product source already formatted.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/laputa-app/src/bin/laputa-desktop-product.rs
            git commit -m 'style(ui): rustfmt product Film Workspace (#LAPUTA-001-D) [model:GPT-5.6 Sol]'
            git push origin HEAD:feature/laputa-001-d-product-workspace
          fi

      - name: Install desktop native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang ffmpeg libclang-dev pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libvulkan-dev

      - name: Validate real FFmpeg preview fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p laputa-render --test real_ffmpeg_preview --locked -- --ignored

      - name: Validate workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          cargo test -p laputa-app --features desktop-ui --bin laputa-desktop --locked
          scripts/validate_project_governance.sh .
