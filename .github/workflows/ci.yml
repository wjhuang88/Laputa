name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0

      - name: Install desktop native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libvulkan-dev

      # Temporary branch bootstrap: removed after the generated Cargo.lock is committed.
      - name: Generate desktop dependency lockfile
        shell: bash
        run: cargo generate-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: laputa-desktop-lockfile
          path: Cargo.lock
          if-no-files-found: error

      - name: Validate workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          cargo test -p laputa-app --features desktop-ui --bin laputa-desktop --locked
          scripts/validate_project_governance.sh .
