name: CI

on:
  push:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Resolve local workspace lock metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p laputa-timeline -p laputa-agent
          git diff -- Cargo.lock
          if git diff --unified=0 -- Cargo.lock | grep -E '^[+-](version|source|checksum) = ' ; then
            echo 'ERROR: lock bootstrap changed a third-party package identity' >&2
            exit 1
          fi
          if git diff --quiet -- Cargo.lock; then
            echo 'ERROR: Cargo.lock did not change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build(timeline): sync local lock metadata (#LAPUTA-001-C) [model:GPT-5.6 Sol]'
          git push origin HEAD:feature/laputa-001-c-first-cut
