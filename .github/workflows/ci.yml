name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0

      - name: Install desktop native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libvulkan-dev

      # Temporary branch bootstrap: apply exact compiler-driven source fixes and remove this step before merge.
      - name: Materialize compiler-driven GPUI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/laputa-app/src/bin/laputa-desktop.rs")
          text = path.read_text()
          old_import = "    App, Bounds, Context, Render, Window, WindowBounds, WindowOptions, div, prelude::*, px, rgb,\n"
          new_import = "    App, Bounds, Context, InteractiveElement, Render, Window, WindowBounds, WindowOptions, div,\n    prelude::*, px, rgb,\n"
          if old_import not in text:
              raise SystemExit("expected GPUI import pattern not found")
          text = text.replace(old_import, new_import, 1)

          old_button = "        button.on_click(cx.listener(move |this, _, _, cx| {\n            this.execute(command, cx);\n        }))\n"
          new_button = "        button.child(label).on_click(cx.listener(move |this, _, _, cx| {\n            this.execute(command, cx);\n        }))\n"
          if old_button not in text:
              raise SystemExit("expected action button pattern not found")
          text = text.replace(old_button, new_button, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          if ! git diff --quiet -- crates/laputa-app/src/bin/laputa-desktop.rs; then
            git config user.name "Laputa CI"
            git config user.email "actions@users.noreply.github.com"
            git add crates/laputa-app/src/bin/laputa-desktop.rs
            git commit -m "fix(app): align desktop shell with pinned GPUI API (#LAPUTA-001-A) [model:GPT-5.6 Sol]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Validate workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          cargo test -p laputa-app --features desktop-ui --bin laputa-desktop --locked
          scripts/validate_project_governance.sh .
