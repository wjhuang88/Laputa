name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0

      - name: Install desktop native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libvulkan-dev

      # Temporary branch bootstrap: removed after Cargo.lock and rustfmt output are committed.
      - name: Materialize lockfile and rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          if ! git diff --quiet -- Cargo.lock crates/laputa-app/src/desktop_state.rs crates/laputa-app/src/bin/laputa-desktop.rs; then
            git config user.name "Laputa CI"
            git config user.email "actions@users.noreply.github.com"
            git add Cargo.lock crates/laputa-app/src/desktop_state.rs crates/laputa-app/src/bin/laputa-desktop.rs
            git commit -m "build(app): materialize GPUI lock and format (#LAPUTA-001-A) [model:GPT-5.6 Sol]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Validate workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          cargo test -p laputa-app --features desktop-ui --bin laputa-desktop --locked
          scripts/validate_project_governance.sh .
