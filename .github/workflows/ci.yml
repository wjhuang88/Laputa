name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0

      - name: Install desktop native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libvulkan-dev

      # Temporary branch bootstrap: apply the exact compiler-driven source fix and remove this step before merge.
      - name: Materialize scroll container identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/laputa-app/src/bin/laputa-desktop.rs")
          text = path.read_text()
          old = "                div()\n                    .flex_1()\n                    .min_h_0()\n                    .overflow_y_scroll()"
          new = "                div()\n                    .id(\"asset-browser-scroll\")\n                    .flex_1()\n                    .min_h_0()\n                    .overflow_y_scroll()"
          if old not in text:
              raise SystemExit("expected asset browser scroll pattern not found")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          if ! git diff --quiet -- crates/laputa-app/src/bin/laputa-desktop.rs; then
            git config user.name "Laputa CI"
            git config user.email "actions@users.noreply.github.com"
            git add crates/laputa-app/src/bin/laputa-desktop.rs
            git commit -m "fix(app): identify Asset Browser scroll state (#LAPUTA-001-A) [model:GPT-5.6 Sol]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Validate workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          cargo test -p laputa-app --features desktop-ui --bin laputa-desktop --locked
          scripts/validate_project_governance.sh .
