name: CI

on:
  push:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply product Clippy fix
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/use anyhow::{Context as _, Result};/use anyhow::Result;/' crates/laputa-app/src/bin/laputa-desktop-product.rs
          if git diff --quiet -- crates/laputa-app/src/bin/laputa-desktop-product.rs; then
            echo 'ERROR: expected import fix did not change product source' >&2
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/laputa-app/src/bin/laputa-desktop-product.rs
          git commit -m 'fix(ui): remove unused product import (#LAPUTA-001-D) [model:GPT-5.6 Sol]'
          git push origin HEAD:feature/laputa-001-d-product-workspace
