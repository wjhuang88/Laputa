name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0

      - name: Install desktop native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang ffmpeg libclang-dev pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libvulkan-dev

      - name: Validate real FFmpeg preview fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p laputa-render --test real_ffmpeg_preview --locked -- --ignored

      - name: Validate workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          cargo test -p laputa-app --features desktop-ui --lib --locked
          cargo test -p laputa-app --features desktop-ui --bin laputa-desktop --locked
          scripts/validate_project_governance.sh .

  # Run the heavier non-Linux persistence suite only for #44's validation PR
  # or when maintainers explicitly dispatch the existing CI workflow.
  generation-store-macos:
    name: Generation store / macOS
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ci/laputa-001-j-generation-state-portability-44'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.95
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Test generation state persistence
        shell: bash
        run: cargo +1.95.0 test -p laputa-media --lib generation_store::tests:: --locked -- --nocapture

  generation-store-windows:
    name: Generation store / Windows
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ci/laputa-001-j-generation-state-portability-44'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.95
        shell: pwsh
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Test generation state persistence
        shell: pwsh
        run: cargo +1.95.0 test -p laputa-media --lib generation_store::tests:: --locked -- --nocapture
