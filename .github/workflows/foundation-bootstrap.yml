name: Foundation bootstrap validation

on:
  push:
    branches:
      - feature/laputa-001-a-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0

      - name: Harden import transaction and evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/laputa-media/src/lib.rs')
          source = path.read_text()

          before = '''        self.save(&candidate)?;
                  for asset in &imported {
                      fs::create_dir_all(self.asset_cache_dir(asset.id)).with_context(|| {
                          format!("failed to create cache directory for asset {}", asset.id)
                      })?;
                      fs::create_dir_all(self.asset_derivatives_dir(asset.id)).with_context(|| {
                          format!(
                              "failed to create derivative directory for asset {}",
                              asset.id
                          )
                      })?;
                  }
          '''
          after = '''        for asset in &imported {
                      fs::create_dir_all(self.asset_cache_dir(asset.id)).with_context(|| {
                          format!("failed to create cache directory for asset {}", asset.id)
                      })?;
                      fs::create_dir_all(self.asset_derivatives_dir(asset.id)).with_context(|| {
                          format!(
                              "failed to create derivative directory for asset {}",
                              asset.id
                          )
                      })?;
                  }
                  self.save(&candidate)?;
          '''
          if before in source:
              source = source.replace(before, after, 1)

          hash_anchor = '''        assert_eq!(report.imported.len(), 2);
                  assert_eq!(sha256_file(&image)?, image_before);
          '''
          hash_evidence = '''        assert_eq!(report.imported.len(), 2);
                  assert_eq!(report.imported[0].source_sha256, image_before);
                  assert_eq!(report.imported[1].source_sha256, video_before);
                  assert_eq!(sha256_file(&image)?, image_before);
          '''
          if hash_anchor in source:
              source = source.replace(hash_anchor, hash_evidence, 1)

          duplicate_anchor = '''    #[test]
              fn duplicate_import_is_rejected_without_manifest_change() -> Result<()> {
          '''
          probe_test = '''    #[derive(Debug)]
              struct FailingProbe;

              impl MediaProbe for FailingProbe {
                  fn probe(&self, _source: &Path, _kind: MediaKind) -> Result<AssetTechnicalMetadata> {
                      anyhow::bail!("fixture probe failure")
                  }
              }

              #[test]
              fn probe_failure_does_not_mutate_manifest_or_original() -> Result<()> {
                  let temp = tempdir()?;
                  let image = temp.path().join("photo.jpg");
                  fs::write(&image, b"image")?;
                  let before = sha256_file(&image)?;

                  let store = ProjectStore::at(temp.path().join("project"));
                  let baseline = store.create("Trip")?;
                  let result = store.import_media(std::slice::from_ref(&image), &FailingProbe);

                  assert!(result.is_err());
                  assert_eq!(store.open()?, baseline);
                  assert_eq!(sha256_file(&image)?, before);
                  Ok(())
              }

          '''
          if 'struct FailingProbe;' not in source and duplicate_anchor in source:
              source = source.replace(duplicate_anchor, probe_test + duplicate_anchor, 1)

          path.write_text(source)
          PY

      - name: Materialize lockfile and formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          git config user.name 'Laputa Foundation CI'
          git config user.email 'actions@users.noreply.github.com'
          git add Cargo.lock Cargo.toml crates README.md README.zh-CN.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix(media): harden import transaction and evidence (#LAPUTA-001-A) [model:GPT-5.6 Sol]'
            git push origin HEAD:feature/laputa-001-a-foundation
          fi

      - name: Baseline validation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          scripts/validate_project_governance.sh .
