name: Generation State Portability

on:
  push:
    paths:
      - "crates/laputa-media/**"
      - "crates/laputa-domain/**"
      - "crates/laputa-agent/src/generation_orchestration.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/generation-state-portability.yml"
  pull_request:
    paths:
      - "crates/laputa-media/**"
      - "crates/laputa-domain/**"
      - "crates/laputa-agent/src/generation_orchestration.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/generation-state-portability.yml"

permissions:
  contents: read

jobs:
  generation-store-cross-platform:
    name: Durable generation state (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Test generation store and cross-process writers
        run: cargo test -p laputa-media --lib generation_store::tests:: --locked
