name: Generation State Portability

on:
  push:
    paths:
      - 'crates/laputa-media/**'
      - '.github/workflows/generation-state-portability.yml'
  pull_request:
    paths:
      - 'crates/laputa-media/**'
      - '.github/workflows/generation-state-portability.yml'

permissions:
  contents: read

jobs:
  generation-store-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test generation persistence on macOS
        run: cargo +1.95.0 test -p laputa-media --lib generation_store::tests:: --locked

  generation-store-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test generation persistence on Windows
        run: cargo +1.95.0 test -p laputa-media --lib generation_store::tests:: --locked
