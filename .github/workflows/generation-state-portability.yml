name: Generation State Portability

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Test macOS generation state
        run: |
          cargo +1.95.0 test -p laputa-media --lib generation_store::tests:: --locked -- --nocapture

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Verify Windows runner
        run: echo "Windows ready"
