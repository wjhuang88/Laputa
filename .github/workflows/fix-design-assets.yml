name: Fix design assets

on:
  push:
    branches:
      - fix/design-assets-binary-upload
    paths:
      - bootstrap/design-assets/READY

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify design assets
        shell: bash
        run: |
          set -euo pipefail

          cat bootstrap/design-assets/01-home.part.* | base64 -d > docs/design/assets/v0.1/01-home.jpg
          cat bootstrap/design-assets/02-import.part.* | base64 -d > docs/design/assets/v0.1/02-import.jpg
          cat bootstrap/design-assets/03-workspace.part.* | base64 -d > docs/design/assets/v0.1/03-workspace.jpg

          test "$(git hash-object docs/design/assets/v0.1/01-home.jpg)" = "2dbbdf18096bc257705a42e1f2b5cae7af054f34"
          test "$(git hash-object docs/design/assets/v0.1/02-import.jpg)" = "8d7f72f62c62b7dd7489a9b1c2a0717558fdf2b9"
          test "$(git hash-object docs/design/assets/v0.1/03-workspace.jpg)" = "44e8bd0484c1da0546098cc35a3a31a9d20d0fe4"

          file docs/design/assets/v0.1/*.jpg

      - name: Commit recovered binaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap/design-assets
          rm -f .github/workflows/fix-design-assets.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code >/dev/null && exit 0
          git commit -m "fix(design): restore binary visual assets (#LAPUTA-001-A) [model:GPT-5.6 Sol]"
          git push
