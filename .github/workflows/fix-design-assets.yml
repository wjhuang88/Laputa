name: Fix design assets

on:
  push:
    branches:
      - fix/design-assets-binary-upload
    paths:
      - bootstrap/design-assets/READY

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify design assets
        shell: bash
        run: |
          set -euo pipefail

          cat \
            bootstrap/design-assets/01-home.final.00 \
            bootstrap/design-assets/01-home.final.01 \
            bootstrap/design-assets/01-home.final.02 \
            bootstrap/design-assets/01-home.final.03 \
            bootstrap/design-assets/01-home.tail \
            | base64 -d > docs/design/assets/v0.1/01-home.webp

          cat bootstrap/design-assets/02-import.full \
            | base64 -d > docs/design/assets/v0.1/02-import.webp

          cat \
            bootstrap/design-assets/03-workspace.final.00 \
            bootstrap/design-assets/03-workspace.final.01 \
            bootstrap/design-assets/03-workspace.final.02 \
            bootstrap/design-assets/03-workspace.final.03 \
            bootstrap/design-assets/03-workspace.final.04 \
            bootstrap/design-assets/03-workspace.final.05 \
            bootstrap/design-assets/03-workspace.final.06 \
            bootstrap/design-assets/03-workspace.final.07 \
            | base64 -d > docs/design/assets/v0.1/03-workspace.webp

          test "$(git hash-object docs/design/assets/v0.1/01-home.webp)" = "7c43b93c337e3065d42277fde3c2b20b45ee932e"
          test "$(git hash-object docs/design/assets/v0.1/02-import.webp)" = "a45378735917b47429751e73802c1c9a0a6e1040"
          test "$(git hash-object docs/design/assets/v0.1/03-workspace.webp)" = "c648120f5641773ab2ffe8158663e0b573369f16"

          file docs/design/assets/v0.1/*.webp

      - name: Commit recovered binaries
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/design/assets/v0.1/*.jpg
          rm -rf bootstrap/design-assets
          rm -f .github/workflows/fix-design-assets.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code >/dev/null && exit 0
          git commit -m "fix(design): restore visual assets with verified WebP binaries (#LAPUTA-001-A) [model:GPT-5.6 Sol]"
          git push
