name: Fix design assets

on:
  push:
    branches:
      - fix/design-assets-binary-upload
    paths:
      - bootstrap/design-assets/READY

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify design assets
        shell: bash
        run: |
          set -euo pipefail

          cat bootstrap/design-assets/01-home.part.* | base64 -d > docs/design/assets/v0.1/01-home.webp
          cat bootstrap/design-assets/02-import.part.* | base64 -d > docs/design/assets/v0.1/02-import.webp
          cat bootstrap/design-assets/03-workspace.part.* | base64 -d > docs/design/assets/v0.1/03-workspace.webp

          test "$(git hash-object docs/design/assets/v0.1/01-home.webp)" = "e1532d5fdf460e3f49de39223645631f7ab12202"
          test "$(git hash-object docs/design/assets/v0.1/02-import.webp)" = "f72b6722881882853e12b45a8a40a9aba09af6a9"
          test "$(git hash-object docs/design/assets/v0.1/03-workspace.webp)" = "cc41e436e5522285c0203f418eadb50294f624b3"

          file docs/design/assets/v0.1/*.webp

      - name: Commit recovered binaries
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/design/assets/v0.1/*.jpg
          rm -rf bootstrap/design-assets
          rm -f .github/workflows/fix-design-assets.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code >/dev/null && exit 0
          git commit -m "fix(design): restore visual assets with verified WebP binaries (#LAPUTA-001-A) [model:GPT-5.6 Sol]"
          git push
